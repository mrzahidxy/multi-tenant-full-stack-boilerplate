name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: express-postgres-boilerplate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app_user:app_password@127.0.0.1:5433/app_db?schema=public
      DIRECT_URL: postgresql://app_user:app_password@127.0.0.1:5433/app_db?schema=public
      JWT_SECRET: ci-only-local-jwt-secret
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: express-postgres-boilerplate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run prisma:migrate:deploy
      - run: npm run seed:starter
      - name: Check API health and project isolation
        run: |
          node dist/server.js > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/health; then
              node --test tests/projects.test.cjs
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat api.log >&2
          exit 1

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-dashboard-boilerplate
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_SECRET: ci-only-local-nextauth-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: nextjs-dashboard-boilerplate/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
